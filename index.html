<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Survey</title>
</head>
<body>

    <h1 id="title">Student Feedback Survey</h1>

    <p id="description">
        Help us improve the learning experience by sharing your feedback.
    </p>

    <form id="survey-form">

        <label id="name-label" for="name">Full Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
        >

        <br><br>

        <label id="email-label" for="email">Email Address:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <br><br>

        <label id="number-label" for="number">Age:</label>
        <input
            type="number"
            id="number"
            name="age"
            min="16"
            max="60"
            placeholder="Enter your age"
        >

        <br><br>

        <label for="dropdown">How would you rate your learning experience?</label>
        <select id="dropdown" name="experience">
            <option value="excellent">Excellent</option>
            <option value="good">Good</option>
            <option value="average">Average</option>
            <option value="poor">Needs Improvement</option>
        </select>

        <br><br>

        <p>Which learning method do you prefer?</p>

        <label>
            <input type="radio" name="learning-method" value="online">
            Online Learning
        </label>

        <br>

        <label>
            <input type="radio" name="learning-method" value="classroom">
            Classroom Learning
        </label>

        <br>

        <label>
            <input type="radio" name="learning-method" value="both">
            Both
        </label>

        <br><br>

        <p>Which skills would you like to improve?</p>

        <label>
            <input type="checkbox" name="skills" value="html">
            HTML
        </label>

        <br>

        <label>
            <input type="checkbox" name="skills" value="css">
            CSS
        </label>

        <br>

        <label>
            <input type="checkbox" name="skills" value="javascript">
            JavaScript
        </label>

        <br>

        <label>
            <input type="checkbox" name="skills" value="programming">
            Programming
        </label>

        <br><br>

        <label for="comments">Additional Comments:</label>
        <br>
        <textarea
            id="comments"
            name="comments"
            rows="5"
            cols="35"
            placeholder="Share your suggestions here..."
        ></textarea>

        <br><br>

        <button id="submit" type="submit">Submit Feedback</button>

    </form>

</body>
</html>
